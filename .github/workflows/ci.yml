name: Crewboard Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Backend CI: Python 3.11, Linting, Alembic Validation & Pytest Suite
  # ============================================================================
  backend-ci:
    name: Backend CI (Pytest & Alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Alembic Migration Consistency
        run: |
          python -c "
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config('alembic.ini')
          script = ScriptDirectory.from_config(cfg)
          heads = script.get_heads()
          print(f'Alembic heads verified: {heads}')
          assert len(heads) == 1, f'Expected exactly 1 migration head, found: {heads}'
          "

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: "testing"
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "test_secret_key_for_ci_environment_validation_32chars"
        run: |
          pytest -v --tb=short

  # ============================================================================
  # 2. Frontend CI: Node 20, ESLint, Unit Tests & Production Vite Build
  # ============================================================================
  frontend-ci:
    name: Frontend CI (Lint, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npm run lint

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Run Production Vite Build
        run: npm run build

  # ============================================================================
  # 3. Docker CI: Topology Validation & BuildKit Container Builds
  # ============================================================================
  docker-ci:
    name: Docker CI (Compose & BuildKit)
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Test Environment Configuration
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration (Development / Unified)
        run: docker compose config

      - name: Validate Docker Compose Configuration (Production Override)
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config

      - name: Build Backend Image with BuildKit
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: crewboard-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image with BuildKit
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: crewboard-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
