name: Crewboard CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Quality & Pytest Validation
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest -v

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Build & Lint Validation
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Production Build
        run: |
          cd frontend
          npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Docker Compose Topology Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Sample Environment File
        run: cp .env.example .env

      - name: Validate Docker Compose Config
        run: docker compose config

