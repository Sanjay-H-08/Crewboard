[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "crewboard-backend"
version = "0.1.0"
description = "FastAPI backend for Crewboard student project management"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

