# ==============================================================================
# CREWBOARD — DOCKER COMPOSE BASE TOPOLOGY
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: crewboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crewboard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided via .env}
      POSTGRES_DB: ${POSTGRES_DB:-crewboard}
    volumes:
      - crewboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crewboard_user} -d ${POSTGRES_DB:-crewboard}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crewboard_network

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service (Python 3.11 + Alembic Migrations)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crewboard_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-crewboard_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided via .env}@db:5432/${POSTGRES_DB:-crewboard}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be provided via .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    volumes:
      - crewboard_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - crewboard_network

  # ----------------------------------------------------------------------------
  # React + Vite Frontend Service (Nginx Reverse Proxy & Static Host)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crewboard_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - crewboard_network

volumes:
  crewboard_pgdata:
    name: crewboard_pgdata
  crewboard_uploads:
    name: crewboard_uploads

networks:
  crewboard_network:
    name: crewboard_network
    driver: bridge
