# ==============================================================================
# CREWBOARD FRONTEND — HARDENED NGINX CONFIGURATION
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Security: Hide Nginx version
    server_tokens off;

    # Security headers for browser protection
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for static text/code assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Support deliverable file uploads up to 128MB (accommodates 25MB individual files plus multipart metadata)
    client_max_body_size 128M;

    root /usr/share/nginx/html;
    index index.html;

    # Cache immutable static assets with content hashes for 1 year
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ensure index.html is revalidated immediately so React SPA updates reflect without cache lag
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Reverse proxy /api/ requests to the FastAPI backend service
    location /api/ {
        client_max_body_size 128M;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA routing fallback: serve /index.html for client-side React Router paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
